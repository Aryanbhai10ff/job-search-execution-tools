<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Search Strategy Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#192338;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 16px}.tag{color:#3157d5;font-size:11px;font-weight:800;letter-spacing:.12em}.card{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:32px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}.muted,small{color:#68748a}label{display:block;font-weight:650;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d5dce8;border-radius:8px;font:inherit}textarea{min-height:75px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:8px;padding:10px 14px;background:#3157d5;color:white;font-weight:700;cursor:pointer;margin:8px 6px 0 0}.alt{background:#eaf0ff;color:#3157d5}.out{white-space:pre-wrap;background:#f7f8fc;border-radius:9px;padding:13px;min-height:60px}.item{border:1px solid #e1e6ef;border-radius:9px;padding:10px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f6f7fb;border-radius:9px;padding:12px}.stat b{display:block;font-size:24px}@media(max-width:580px){.grid{grid-template-columns:1fr}.wrap{margin:18px auto}.stats{grid-template-columns:1fr 1fr}}footer{text-align:center;color:#68748a;font-size:12px;padding:20px}</style><main class="wrap"><div class="tag">COMPLETE JOB SEARCH EXECUTION SYSTEM · MODULE 01</div><h1>Job Search Strategy Builder</h1><p class="muted">Define your target role, priorities and practical search approach.</p><section class="card"><h2>Build your job-search direction</h2><div class="grid"><div><label>Target job title *</label><input id="role" placeholder="e.g. Junior Graphic Designer"></div><div><label>Industry</label><input id="industry" placeholder="Technology, healthcare..."></div><div><label>Experience level</label><select id="level"><option>Internship</option><option>Entry-level</option><option>1–3 years</option><option>3–5 years</option><option>5+ years</option><option>Career change</option></select></div><div><label>Work arrangement</label><select id="mode"><option>Remote</option><option>On-site</option><option>Hybrid</option><option>Any</option></select></div><div><label>Preferred location</label><input id="loc" placeholder="City / country / worldwide"></div><div><label>Weekly time available</label><select id="time"><option>2–4 hours</option><option>5–7 hours</option><option>8–12 hours</option><option>13+ hours</option></select></div></div><label>Top priorities</label><textarea id="priorities" placeholder="Learning, salary, growth..."></textarea><label>Biggest challenge</label><textarea id="challenge"></textarea><button onclick="build()">Build my strategy</button><button class="alt" onclick="location.reload()">Reset</button></section><section class="card"><h2>Your strategy</h2><div id="out" class="out">Complete the fields and generate your strategy.</div><button class="alt" onclick="copyOut()">Copy</button><button class="alt" onclick="downloadOut()">Download TXT</button></section><footer>Module 01 · Job Search Strategy</footer></main><script>let report='';function val(id){return document.getElementById(id).value.trim()||'Not specified'}function build(){if(!val('role')||val('role')==='Not specified'){alert('Enter your target job title.');return}report=`MY JOB SEARCH STRATEGY\nTarget role: ${val('role')}\nIndustry: ${val('industry')}\nExperience: ${val('level')}\nWork arrangement: ${val('mode')}\nLocation: ${val('loc')}\nWeekly time: ${val('time')}\nPriorities: ${val('priorities')}\nMain challenge: ${val('challenge')}\n\nACTION PLAN\n1. Search using the target title and relevant related titles.\n2. Prioritise vacancies matching your experience and preferences.\n3. Research employers before applying.\n4. Tailor application materials to each suitable role.\n5. Track applications, responses and follow-ups.\n6. Review results weekly and adjust based on evidence.\n\nWEEKLY REVIEW\nWhat worked: __________\nWhat to improve: __________\nNext action: __________`;document.getElementById('out').textContent=report}function copyOut(){if(report)navigator.clipboard.writeText(report);else alert('Generate your strategy first.')}function downloadOut(){if(report)save('job-search-strategy.txt',report);else alert('Generate your strategy first.')}function save(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click();URL.revokeObjectURL(a.href)}</script></html>
